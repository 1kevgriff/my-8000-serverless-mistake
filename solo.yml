name: My $8,000 Serverless Mistake
processes:
  Slidev dev:
    command: node scripts/dev.mjs
    working_dir: slidev
    auto_start: false
  Slidev build:
    command: npm run build
    working_dir: slidev
    auto_start: false
  Slidev export PDF:
    command: npm run export
    working_dir: slidev
    auto_start: false
  npm install:
    command: npm install
    working_dir: slidev
    auto_start: false
